<!DOCTYPE html>
<html lang="ru">
  <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>JavaScript Console</title>

	<script>
		const originalConsoleLog = console.log
		const originalConsoleError = console.error

		window.print = (message, type = 'result') => {
			const output = document.getElementById('output')

			output.insertAdjacentHTML('beforeend', `<div class="${type}">${message}</div>`)
			output.scrollTop = output.scrollHeight
		}

		console.log = (message) => {
			originalConsoleLog(message)
			print(message)
		}

		console.error = (message) => {
			originalConsoleError(message)
			print(message, 'error')
		}

		window.addEventListener(
			'unhandledrejection',
			({ reason }) => print(`Uncaught (in promise) ${reason}`, 'error'),
		)

		window.onerror =  (message, source, lineno, colno, error) => {
			print(`Uncaught Error: ${message} at ${source}:${lineno}:${colno}`, 'error')
		}

		window.executeCode = () => {
			const inputField = document.getElementById('inputField')

			const code = inputField.value
			inputField.value = ''

			print(code, 'code')

			try {
				console.log(eval(code))
			} catch (e) {
				console.error(e)
			}

			window.scrollTo(0, document.body.scrollHeight)
		 }
	</script>

	<style>
		 body {
			 font-size: 12px;
			 background-color: #f4f4f4;
			 padding: 1rem;
			 font-family: monospace;
		 }

		 #output {
			 border: 1px solid #ccc;
			 padding: 10px;
			 overflow-y: auto;
			 background-color: #fff;
			 margin-bottom: 10px;
			 white-space: pre-wrap;
			 display: flex;
			 flex-direction: column;
			 gap: 5px;
		 }

		 #output .welcome {
			 font-weight: bold;
		 }

		 #output .technical {
			 font-style: italic;
			 font-size: .875em;
		 }

		 #output .code::before {
			 content: '> ';
			 color: cadetblue;
		 }

		 #output .result::before {
			 content: '← ';
			 color: cadetblue;
		 }

		 #output .error {
			 color: crimson;
		 }

		 #output .error::before {
			 content: '! ';
		 }

		 #input {
			 display: flex;
			 width: 100%;
		 }

		 #input > * {
			 margin: 0;
			 border: 1px solid #ccc;
		 }

		 #inputField {
			 flex-grow: 1;
		 }

		 #executeButton {
			 width: 50px;

			 border-left: 0px;
		 }
	</style>

	<script src="https://vk.com/js/api/xd_connection.js?2" type="text/javascript"></script>
	<script src="https://vk.com/js/api/openapi.js?169" type="text/javascript"></script>
	<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  </head>

  <body>
	<div id="output"></div>

	<div id="input">
	  <textarea id="inputField" placeholder=">>" rows="5"></textarea>
	  <button id="executeButton" onclick="executeCode()">↵</button>
	</div>

	<script type="text/javascript">
		print('Welcome to JS SDK & VK Bridge Console', 'welcome')
	</script>

	<script type="text/javascript">
		print(
			[
				`User-Agent: ${navigator.userAgent}`,
				`Current Frame Height: <span id="vh-output">...</span>`
			].join('<br />'),
			'technical',
		)

		const measureHeight = () => {
			const height = window.visualViewport?.height ?? window.innerHeight
			document.getElementById('vh-output').textContent = `${height}px`
		}

		window.addEventListener('resize', measureHeight)
		window.addEventListener('orientationchange', measureHeight)
		document.addEventListener('DOMContentLoaded', measureHeight)

		if (window.visualViewport) {
			window.visualViewport.addEventListener('resize', measureHeight);
		}
	</script>

	<script type="text/javascript">
		VK.init(
			() => print([
				'VK.init() completed.',
				'Docs: <a href="https://dev.vk.com/sdk/javascript" target="_blank">JavaScript SDK</a>.',
				'Usage: VK.someMethod()',
			].join(' ')),
			() => print('VK API initialization failed', 'error'),
			'5.199',
		);
	</script>

	<script type="text/javascript">
		window.bridge = window.vkBridge

		const initBridge = async () => {
			await bridge.send('VKWebAppInit')

			print([
				'VK Bridge inited.',
				'Docs: <a href="https://dev.vk.com/bridge/overview" target="_blank">VK Bridge</a>.',
				'Usage: bridge.send(methodName) or vkBridge.send(methodName)',
			].join(' '))
		}

		initBridge()
	</script>
  </body>
</html>
